<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; background-color: #f4f4f4; color: #333; line-height: 1.6; }
        .container { background: #fff; padding: 25px 20px; border-radius: 15px; max-width: 450px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { font-size: 18px; text-align: center; color: #00b900; border-bottom: 3px solid #00b900; padding-bottom: 12px; margin-bottom: 25px; margin-top: 0; }
        
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; text-align: left; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; background-color: #fafafa; }
        
        .error-msg { color: #d00; font-size: 12px; margin-top: 5px; display: none; font-weight: bold; text-align: left; }
        .notice-msg { color: #00b900; font-size: 12px; margin-top: 5px; display: none; font-weight: bold; text-align: left; }
        
        .important-box { background: #fff0f0; padding: 15px; border-radius: 10px; border: 1px solid #ffcccc; margin-top: 20px; margin-bottom: 10px; color: #d00; font-size: 13px; font-weight: bold; line-height: 1.6; text-align: center; }
        
        .btn { background-color: #00b900; color: white; border: none; padding: 18px; width: 100%; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:disabled { background-color: #ccc !important; cursor: not-allowed; opacity: 0.6; }
    </style>
</head>
<body>

<div class="container">
    <h2>【ご予約フォーム】</h2>
    
    <div class="form-group">
        <label>① ご予約する店舗名</label>
        <select id="shop" onchange="validateForm()">
            <option value="">店舗を選択してください</option>
            <option>飯田店</option><option>有玉店</option><option>葵東店</option>
            <option>中条店</option><option>平口店</option><option>竜洋店</option>
        </select>
    </div>

    <div class="form-group">
        <label>② ご予約日付</label>
        <select id="date" onchange="validateForm()">
            <option value="">日付を選択してください</option>
        </select>
    </div>

    <div class="form-group">
        <label>③ ご予約時間</label>
        <select id="time" onchange="validateForm()">
            <option value="">時間を選択してください</option>
            <option value="10:00">10:00</option><option value="10:30">10:30</option>
            <option value="11:00">11:00</option><option value="11:30">11:30</option>
            <option value="12:00">12:00</option><option value="12:30">12:30</option>
            <option value="13:00">13:00</option><option value="13:30">13:30</option>
            <option value="14:00">14:00</option><option value="14:30">14:30</option>
            <option value="15:00">15:00</option><option value="15:30">15:30</option>
            <option value="16:00">16:00</option><option value="16:30">16:30</option>
            <option value="17:00">17:00</option><option value="17:30">17:30</option>
            <option value="18:00">18:00</option><option value="18:30">18:30</option>
            <option value="19:00">19:00</option><option value="19:30">19:30</option>
            <option value="20:00">20:00</option><option value="20:30">20:30</option>
            <option value="21:00">21:00</option><option value="21:30">21:30</option>
            <option value="22:00">22:00</option>
        </select>
        <p id="leadTimeError" class="error-msg">直近のご予約はスタッフ手配ができません（4時間前まで）</p>
    </div>

    <div class="form-group">
        <label>④ お名前</label>
        <input type="text" id="name" placeholder="氏名を入力" oninput="validateForm()">
    </div>

    <div class="form-group">
        <label>⑤ 年齢</label>
        <select id="age" onchange="validateForm()">
            <option value="">選択してください</option>
            <option value="10代">10代</option>
            <option value="20代">20代</option>
            <option value="30代">30代</option>
            <option value="40代">40代</option>
            <option value="50代">50代</option>
            <option value="60代">60代</option>
            <option value="70以上">70以上</option>
        </select>
        <p id="ageNotice10" class="notice-msg">高校生以上の方に限ります</p>
        <p id="ageNotice70" class="notice-msg">持病が無い方に限ります</p>
    </div>

    <div class="form-group">
        <label>⑥ トレーニング歴</label>
        <input type="text" id="history" placeholder="例：なし、ジム1年など" oninput="validateForm()">
    </div>

    <div class="form-group">
        <label>⑦ 携帯電話番号</label>
        <input type="tel" id="tel" placeholder="ハイフンなし" oninput="validateForm()" onblur="handleTelBlur()">
        <p id="telError" class="error-msg">有効な11桁の携帯番号を入力してください</p>
    </div>

    <div class="form-group">
        <label>⑧ ご予約は本人ですか？</label>
        <select id="isSelf" onchange="validateForm()">
            <option value="">選択してください</option>
            <option value="yes">はい</option>
            <option value="no">いいえ</option>
        </select>
        <p id="selfError" class="error-msg">本人以外はご予約できません</p>
    </div>

    <div class="form-group">
        <label>⑨ 公式HPの内容を理解されていますか？</label>
        <select id="isUnderstand" onchange="validateForm()">
            <option value="">選択してください</option>
            <option value="yes">はい</option>
            <option value="no">いいえ</option>
        </select>
        <p id="understandError" class="error-msg">HPにてまずご確認ください</p>
    </div>

    <div class="form-group">
        <label>⑩ 健康上の問題はありませんか？</label>
        <select id="isHealthy" onchange="validateForm()">
            <option value="">選択してください</option>
            <option value="yes">問題ありません</option>
            <option value="no">問題あります</option>
        </select>
        <p id="healthError" class="error-msg">健康に問題がある場合ご相談ください</p>
    </div>

    <div class="important-box">
        【重要】<br>
        ご予約が確定すると必要な持ち物等が送られてきますので必ずご確認ください。
    </div>
    
    <button id="submitBtn" class="btn" onclick="sendData()" disabled>内容を確認して送信</button>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    const LIFF_ID = "2009898612-8KMHBJAg"; 
    let telTouched = false; 

    // 日付選択肢を生成する関数
    function populateDates() {
        const dateSelect = document.getElementById('date');
        if (!dateSelect) return;
        
        // すでに追加されている場合は二重に追加しない（念のため）
        if (dateSelect.options.length > 1) return;

        const days = ['日', '月', '火', '水', '木', '金', '土'];
        const now = new Date();

        for (let i = 0; i < 14; i++) {
            const d = new Date();
            d.setDate(now.getDate() + i);

            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const date = String(d.getDate()).padStart(2, '0');
            const dayName = days[d.getDay()];

            const val = `${year}-${month}-${date}`;
            const text = `${month}/${date}(${dayName})`;
            
            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = i === 0 ? `今日 ${text}` : text;
            dateSelect.appendChild(opt);
        }
    }

    // ページ読み込み時に実行
    document.addEventListener("DOMContentLoaded", function() {
        populateDates();
        
        liff.init({ liffId: LIFF_ID }).then(() => {
            if (!liff.isLoggedIn()) { liff.login(); }
            validateForm(); 
        }).catch((err) => { console.error(err); });
    });

    function handleTelBlur() {
        telTouched = true;
        validateForm();
    }

    function validateForm() {
        const shop = document.getElementById('shop').value;
        const dateVal = document.getElementById('date').value;
        const timeVal = document.getElementById('time').value;
        const name = document.getElementById('name').value.trim();
        const age = document.getElementById('age').value;
        const history = document.getElementById('history').value.trim();
        const tel = document.getElementById('tel').value.trim();
        const isSelf = document.getElementById('isSelf').value;
        const isUnderstand = document.getElementById('isUnderstand').value;
        const isHealthy = document.getElementById('isHealthy').value;
        
        const submitBtn = document.getElementById('submitBtn');
        let isValid = true;

        const now = new Date();

        // 当日4時間前チェック
        document.getElementById('leadTimeError').style.display = 'none';
        if (dateVal && timeVal) {
            const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            if (dateVal === todayStr) {
                const limitTime = new Date(now.getTime() + (4 * 60 * 60 * 1000));
                const selectedDateTime = new Date(dateVal + 'T' + timeVal);
                if (selectedDateTime < limitTime) {
                    document.getElementById('leadTimeError').style.display = 'block';
                    isValid = false;
                }
            }
        }

        // 年齢チェック
        document.getElementById('ageNotice10').style.display = (age === "10代") ? 'block' : 'none';
        document.getElementById('ageNotice70').style.display = (age === "70以上") ? 'block' : 'none';

        // 電話番号
        const telPattern = /^0[789]0\d{8}$/;
        const cleanTel = tel.replace(/-/g, "");
        if (tel && !telPattern.test(cleanTel)) {
            if (telTouched) document.getElementById('telError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('telError').style.display = 'none';
        }

        // 各種同意
        if (isSelf === 'no') { isValid = false; document.getElementById('selfError').style.display = 'block'; } else { document.getElementById('selfError').style.display = 'none'; }
        if (isUnderstand === 'no') { isValid = false; document.getElementById('understandError').style.display = 'block'; } else { document.getElementById('understandError').style.display = 'none'; }
        if (isHealthy === 'no') { isValid = false; document.getElementById('healthError').style.display = 'block'; } else { document.getElementById('healthError').style.display = 'none'; }

        // 必須入力確認
        if (!shop || !dateVal || !timeVal || !name || !age || !history || !tel || 
            isSelf !== 'yes' || isUnderstand !== 'yes' || isHealthy !== 'yes') {
            isValid = false;
        }

        submitBtn.disabled = !isValid;
    }

    function sendData() {
        const msg = "【入会予約】\n" +
            "■店舗：" + document.getElementById('shop').value + "\n" +
            "■日時：" + document.getElementById('date').value + " " + document.getElementById('time').value + "\n" +
            "■名前：" + document.getElementById('name').value + "様\n" +
            "■年齢：" + document.getElementById('age').value + "\n" +
            "■ﾄﾚ歴：" + document.getElementById('history').value + "\n" +
            "■電話：" + document.getElementById('tel').value;

        liff.sendMessages([{ type: 'text', text: msg }]).then(() => {
            liff.closeWindow();
        }).catch((err) => { alert("送信失敗"); });
    }
</script>
</body>
</html>
